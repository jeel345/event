<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | CATCH UP</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
<link rel="icon" type="image/png" href="/img/favicon.png"><meta name="theme-color" content="#0a0508">
<script src="/js/splash.js"></script></head><body>
<div id="nav"></div>
<main class="row g-0 auth-wrap">
  <div class="col-lg-6 d-flex align-items-center justify-content-center p-4">
    <div style="width:100%;max-width:420px">
      <div class="cu-brand mb-4"><img src="/img/mark.png" alt="">CATCH <span>UP</span></div>
      <h2 class="fw-bold" id="title">Welcome back</h2>
      <p class="muted" id="sub">Log in to continue to your account.</p>
      <form id="f" class="vstack gap-3">
        <div class="signup d-none"><label class="form-label">Full name</label><input class="form-control" name="name" placeholder="Enter your name"></div>
        <div><label class="form-label">Email</label><input type="email" class="form-control" name="email" placeholder="Enter your email" required></div>
        <div class="signup d-none row g-2 mx-0">
          <div class="col-6 ps-0"><label class="form-label">College</label><input class="form-control" name="college" placeholder="College"></div>
          <div class="col-6 pe-0"><label class="form-label">Course</label><input class="form-control" name="course" placeholder="e.g. MCA"></div>
        </div>
        <div class="signup d-none"><label class="form-label">What are you into? <span class="muted">We use this to recommend events. You can change it later.</span></label><div id="ints" class="interest-box"></div></div>
        <div><label class="form-label">Password</label>
          <div class="input-group"><input type="password" class="form-control" name="password" id="pw" placeholder="Enter your password" required minlength="6">
          <button type="button" class="btn btn-ghost" id="eye" aria-label="Show password"><i class="bi bi-eye"></i></button></div></div>
        <div id="err" class="text-danger small"></div>
        <button class="btn btn-cu w-100 py-2" id="btn">Login</button>
      </form>
      <p class="text-center small mt-3 muted"><span id="alt">Don't have an account?</span> <a href="#" id="toggle">Register</a></p>
    </div>
  </div>
  <div class="col-lg-6 auth-art"><h2>Better<br>Events<br>Bigger<br>Connections</h2></div>
</main>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
let signup=false,picker=null;const q=new URLSearchParams(location.search);
async function loadPicker(){if(!picker)picker=await interestPicker(ints,[]).catch(()=>null);}
const set=()=>{document.querySelectorAll('.signup').forEach(e=>e.classList.toggle('d-none',!signup));
 title.textContent=signup?'Create your account':'Welcome back';sub.textContent=signup?'Join CATCH UP to register for events.':'Log in to continue to your account.';
 btn.textContent=signup?'Create account':'Login';if(signup)loadPicker();alt.textContent=signup?'Already have an account?':"Don't have an account?";toggle.textContent=signup?'Login':'Register';};
if(q.get('mode')==='signup'){signup=true;set();}
toggle.onclick=e=>{e.preventDefault();signup=!signup;set();};
eye.onclick=()=>{pw.type=pw.type==='password'?'text':'password'};
f.onsubmit=async e=>{e.preventDefault();err.textContent='';
 const d=Object.fromEntries(new FormData(f));
 if(signup&&!d.name){err.textContent='Please enter your name.';return;}
 try{if(signup&&picker)d.interests=picker.get();
 const r=await API.req(signup?'/auth/signup':'/auth/login','POST',d);API.save(r);
  location.href=q.get('next')||(r.user.role==='admin'?'/admin.html':'/events.html');}
 catch(x){err.textContent=x.message;}};
</script>
</body></html>
