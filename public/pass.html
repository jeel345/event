<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pass | CATCH UP</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
<link rel="icon" type="image/png" href="/img/favicon.png"><meta name="theme-color" content="#0a0508">
<script src="/js/splash.js"></script></head><body>
<div id="nav"></div>
<main class="container py-5" style="max-width:480px"><div class="cu-card p-4 text-center" id="p"><p class="muted">Loading pass...</p></div></main>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const code = new URLSearchParams(location.search).get('code') || '';
API.req('/pass/' + encodeURIComponent(code)).then(r => {
  p.innerHTML = `<div class="small text-danger fw-bold">CATCH UP PASS</div><h4 class="fw-bold mt-1">${esc(r.title)}</h4>
    <div class="muted small mb-3">${fmtDate(r.start_at)} &nbsp; ${fmtRange(r.start_at, r.end_at)}<br>${esc(r.venue)}</div>
    <div class="qr-box"><div id="qr"></div></div><div class="fw-bold mt-2">${esc(r.pass_code)}</div>
    <div class="mt-2">${esc(r.name)}${r.team_name ? ' <span class="badge badge-cat">Team ' + esc(r.team_name) + '</span>' : ''}</div>
    <div class="mt-3"><span class="st st-${r.status}">${r.status === 'checked_in' ? 'Checked in ' + fmtTime(r.checked_in_at) : 'Not checked in yet'}</span></div>`;
  new QRCode(document.getElementById('qr'), { text: r.pass_code, width: 200, height: 200 });
}).catch(e => p.innerHTML = '<p class="muted">' + esc(e.message) + '</p>');
</script>
</body></html>
