<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Events | CATCH UP</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
<link rel="icon" type="image/png" href="/img/favicon.png"><meta name="theme-color" content="#0a0508">
<script src="/js/splash.js"></script></head><body>
<div id="nav"></div>
<main class="container py-4">
  <section class="mb-5">
    <div class="rec-head"><div><h4 class="fw-bold mb-0" id="rt"><i class="bi bi-stars text-danger me-2"></i>Recommended for you</h4><div class="small muted" id="rs"></div></div></div>
    <div class="row g-4" id="recs"></div>
  </section>
  <h4 class="fw-bold mb-3">All events</h4>
  <div class="input-group mb-3"><span class="input-group-text bg-transparent border-secondary-subtle text-secondary"><i class="bi bi-search"></i></span>
    <input id="q" class="form-control" placeholder="Search events"></div>
  <div class="d-flex flex-wrap gap-2 mb-4" id="chips"></div>
  <div class="row g-4" id="list"></div>
</main>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
let cat='All';
['All','Technical','Cultural','Sports','Workshop'].forEach(c=>{const b=document.createElement('button');b.className='chip'+(c==='All'?' on':'');b.textContent=c;
 b.onclick=()=>{cat=c;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));load();};chips.appendChild(b);});
let t;q.oninput=()=>{clearTimeout(t);t=setTimeout(load,250)};
async function load(){
 const ev=await API.req('/events?category='+cat+'&q='+encodeURIComponent(q.value));
 list.innerHTML=ev.length?ev.map(e=>`<div class="col-md-6 col-lg-4"><div class="ev-card">
  <div class="ev-banner ${e.category}"><i class="bi ${catIcon[e.category]}"></i><span class="badge badge-cat">${e.category}</span></div>
  <div class="p-3 d-flex flex-column flex-grow-1"><h5 class="fw-bold">${esc(e.title)}</h5>
   <div class="ev-meta vstack gap-1 mb-3"><span><i class="bi bi-calendar-event"></i>${fmtDate(e.start_at)}</span>
    <span><i class="bi bi-clock"></i>${fmtRange(e.start_at,e.end_at)}</span><span><i class="bi bi-geo-alt"></i>${esc(e.venue)}</span>
    <span><i class="bi bi-people"></i>${e.seats-e.registered} of ${e.seats} spots left</span><span><i class="bi bi-diagram-3"></i>${e.type==='group'?'Team event, '+e.min_team+' to '+e.max_team+' members':'Individual entry'}</span></div>
   <a href="/event.html?id=${e.id}" class="btn btn-cu mt-auto">Register</a></div></div></div>`).join('')
  :'<p class="muted">No events match your search. Try another category.</p>';}
load();
async function loadRecs(){
 try{const r=await API.req('/recommendations?limit=3');
  const mine=r.personalized&&r.items.some(e=>e.match!=null);
  rt.innerHTML='<i class="bi bi-stars text-danger me-2"></i>'+(mine?'Recommended for you':'Popular on campus');
  rs.innerHTML=!API.token()?'<a href="/login.html?mode=signup">Create an account</a> and pick your interests to get events chosen for you.'
    :!r.has_interests?'Tell us what you like on your <a href="/profile.html">profile</a> and these picks get a lot better.'
    :'Based on your interests and the events you have joined.';
  recs.innerHTML=r.items.length?r.items.map(recCard).join(''):'<div class="col-12"><div class="rec-empty">No open events right now. New ones will appear here as soon as organizers add them.</div></div>';
 }catch(x){recs.innerHTML=''}}
loadRecs();
document.addEventListener('cu:notify',e=>{if(e.detail.type==='new_event'){loadRecs();load();}});
</script>
</body></html>
