<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us | CATCH UP</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
<link rel="icon" type="image/png" href="/img/favicon.png"><meta name="theme-color" content="#0a0508">
<script src="/js/splash.js"></script></head><body>
<div id="nav"></div>
<main class="container py-5"><div class="row g-5">
  <div class="col-lg-6">
    <h1 class="fw-bold display-5">Contact us</h1>
    <p class="muted">We'd love to hear from you. Get in touch with any queries or support.</p>
    <div class="vstack gap-3 mt-4">
      <div class="feature"><i class="bi bi-envelope"></i><div><b>Email</b><div class="small muted">support@catchup.com</div></div></div>
      <div class="feature"><i class="bi bi-telephone"></i><div><b>Phone</b><div class="small muted">+91 98765 43210</div></div></div>
      <div class="feature"><i class="bi bi-geo-alt"></i><div><b>Location</b><div class="small muted">Atmiya University, Rajkot</div></div></div>
    </div>
  </div>
  <div class="col-lg-6"><form id="f" class="cu-card p-4 vstack gap-3">
    <div><label class="form-label">Name</label><input class="form-control" name="name" placeholder="Enter your name" required></div>
    <div><label class="form-label">Email</label><input type="email" class="form-control" name="email" placeholder="Enter your email" required></div>
    <div><label class="form-label">Message</label><textarea class="form-control" name="message" rows="4" placeholder="Type your message" required></textarea></div>
    <button class="btn btn-cu">Send message</button></form></div>
</div></main>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>f.onsubmit=async e=>{e.preventDefault();try{await API.req('/contact','POST',Object.fromEntries(new FormData(f)));toast('Message sent. We will reply by email.');f.reset();}catch(x){toast(x.message,false)}}</script>
</body></html>
