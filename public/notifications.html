<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications | CATCH UP</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
<link rel="icon" type="image/png" href="/img/favicon.png"><meta name="theme-color" content="#0a0508">
<script src="/js/splash.js"></script></head><body>
<div id="nav"></div>
<main class="container py-4" style="max-width:760px">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div><h2 class="fw-bold mb-0">Notifications</h2><div class="small muted"><i class="bi bi-broadcast text-danger me-1"></i>New updates appear here the moment they happen.</div></div>
    <button class="btn btn-ghost btn-sm" id="all">Mark all read</button></div>
  <div class="cu-card overflow-hidden" id="list2"></div>
</main>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
const authed = needLogin();
const empty = '<div class="p-4 muted">No notifications yet. Register for an event and updates about it will show up here.</div>';
async function load() {
  const r = await API.req('/notifications?limit=100');
  list2.innerHTML = r.items.length ? r.items.map(noteHTML).join('') : empty;
}
all.onclick = async () => { await API.req('/notifications/read', 'POST', {}); document.querySelectorAll('#list2 .note').forEach(n => n.classList.remove('unread')); setUnread(0); };
document.addEventListener('cu:notify', e => { const em = list2.querySelector('.muted.p-4'); if (em) em.remove(); list2.insertAdjacentHTML('afterbegin', noteHTML(e.detail)); });
if (authed) load().catch(x => toast(x.message, false));
</script>
</body></html>
